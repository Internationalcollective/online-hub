<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>International Collective Online Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Jost:wght@200;300;400;500&family=Oswald:wght@300;400;500&family=Nunito+Sans:wght@300;400;500&display=swap">
<style>
/* International Collective online hub: neutral house style shared by every brand. */
:root{
  --bg:#F4F4F2; --paper:#FFFFFF; --ink:#2E3033; --strong:#141517; --muted:#6F7277; --grey1:#C6C7C4; --line:#E3E3DF; --soft:#F4F4F2;
  --head:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --danger:#9B4A43;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#151614;--paper:#1D1E1C;--ink:#DADBD7;--strong:#F2F2EF;--muted:#9A9C98;--grey1:#4E504C;--line:#2E302D;--soft:#242522;--danger:#E59A92;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#151614;--paper:#1D1E1C;--ink:#DADBD7;--strong:#F2F2EF;--muted:#9A9C98;--grey1:#4E504C;--line:#2E302D;--soft:#242522;--danger:#E59A92;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.6;padding-inline:16px;padding-block:28px 72px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.cap{font-family:var(--head);font-size:10.5px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)} .app.has-sel .side{display:none} .app:not(.has-sel) .main{display:none}}
@media (min-width:901px){.back{display:none!important}}

/* sidebar */
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.brand{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand .org{font-family:var(--head);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-family:var(--head);font-weight:600;font-size:22px;line-height:1.2;letter-spacing:.01em;text-transform:none;color:var(--ink)}
.brand .slogan{font-family:var(--head);font-weight:300;font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--muted)}
.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:0;padding:9px 12px}
.tools input::placeholder{color:var(--muted)}
.btn{border:1px solid var(--grey1);background:var(--paper);border-radius:0;padding:8px 14px;font-family:var(--head);font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:10px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h2{margin:0 0 2px;font-family:var(--head);font-size:10.5px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.item{display:grid;grid-template-columns:44px 1fr;gap:14px;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:0;padding:12px 14px}
.item:hover{border-color:var(--grey1)}
.item[aria-current="true"]{border-color:var(--ink)}
.item .d{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);padding-right:12px}
.item .d b{font-family:var(--head);font-weight:300;font-size:26px;line-height:1;color:var(--ink)}
.item .d span{font-family:var(--head);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.item .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .t strong{font-family:var(--head);font-weight:600;font-size:14px;letter-spacing:0;text-transform:none;color:var(--strong);overflow-wrap:anywhere}
.item .t small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--head);font-size:9.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:1px 7px;color:var(--muted);background:transparent}
.chip.issued{border-color:var(--ink);color:var(--ink)}
.chip.issued::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink)}
.chip.draft{border-style:dashed;border-color:var(--grey1)}
.chip.wrapped{background:var(--soft)}
.chip.tbc{border-style:dashed;border-color:var(--grey1);color:var(--muted);letter-spacing:.2em}

/* sheet */
.main{min-width:0}
.sheet{background:var(--paper);border:1px solid var(--line)}
.sheet-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;padding:36px 32px 30px;border-bottom:1px solid var(--line);align-items:end}
@media (max-width:640px){.sheet-top{grid-template-columns:1fr;padding:28px 20px 24px}}
.kicker{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--head);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kicker .cs{color:var(--ink)}
.sheet-top h2{margin:18px 0 8px;font-family:var(--head);font-weight:600;font-size:clamp(24px,3.6vw,36px);line-height:1.25;letter-spacing:-.01em;text-transform:none;color:var(--ink);text-wrap:balance}
.sheet-top .sub{margin:0;font-family:var(--head);font-weight:500;font-size:16px;letter-spacing:0;text-transform:none;color:var(--muted)}
.sheet-top .when{margin-top:12px;font-family:var(--body);color:var(--strong)}
.callbox{border-left:1px solid var(--line);padding:4px 0 4px 24px;display:flex;flex-direction:column;align-items:flex-start;min-width:190px}
@media (max-width:640px){.callbox{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}}
.callbox span{font-family:var(--head);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.callbox b{font-family:var(--head);font-weight:500;font-size:48px;line-height:1.1;letter-spacing:.04em;color:var(--ink);margin-top:4px}
.callbox small{color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--soft);align-items:center}
@media (max-width:640px){.actions{padding:12px 20px}}
.actions .sp{flex:1}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-bottom:1px solid var(--line)}
.fact{padding:18px 32px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){.fact{padding:16px 20px}}
.k{font-family:var(--head);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fact .v{color:var(--strong);overflow-wrap:anywhere;white-space:pre-line;line-height:1.55}
.sec{padding:28px 32px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.sec{padding:24px 20px}}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h3{margin:0;font-family:var(--head);font-size:15px;font-weight:600;letter-spacing:.01em;text-transform:none;color:var(--ink)}
.sec-h .count{font-family:var(--head);font-size:12px;letter-spacing:.1em;color:var(--muted);display:inline-flex;align-items:center}
.bar{height:2px;background:var(--line);overflow:hidden;width:120px;display:inline-block;margin-left:12px}
.bar i{display:block;height:100%;background:var(--ink)}
.tbl{overflow-x:auto;margin-inline:-32px;padding-inline:32px}
@media (max-width:640px){.tbl{margin-inline:-20px;padding-inline:20px}}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:11px 14px 11px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-family:var(--head);font-size:9.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom-color:var(--grey1)}
td.time{font-family:var(--head);font-size:13.5px;letter-spacing:.04em;white-space:nowrap;width:1%;color:var(--ink)}
td.time span{color:var(--muted)}
.people td:first-child{color:var(--strong)}
.people{min-width:620px}
.sched{min-width:560px}
.sched td strong{font-weight:500;color:var(--strong)}
.sched tr.shoot td:nth-child(2) strong::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:10px;vertical-align:1px}
.sched tr.call td:nth-child(2) strong::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;border:1px solid var(--ink);margin-right:10px;vertical-align:2px}
.sched tr.meal td{background:var(--soft)}
.sched td .d{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.6}
.sched td .who{display:block;font-family:var(--head);font-weight:300;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:4px}
.cf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cf .ok{font-family:var(--head);color:var(--ink);font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center}
.cf .ok::before{content:"";width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:radial-gradient(circle,var(--ink) 0 2px,transparent 2.5px)}
.cf .old{color:var(--danger);font-size:11.5px}
.cf small{color:var(--muted);font-size:11.5px;display:block;text-align:right;margin-top:2px}
td.cfc{width:1%;white-space:nowrap}
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.contact{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.contact b{font-family:var(--head);font-weight:600;letter-spacing:0;text-transform:none;color:var(--strong)}
.contact .r{color:var(--muted);font-size:12.5px}
.contact .n{font-size:13px;user-select:all;overflow-wrap:anywhere;color:var(--ink)}
ul.list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.list li{padding-left:20px;position:relative;line-height:1.7}
ul.list li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;border:1px solid var(--grey1)}
.open td:first-child{color:var(--strong)}
.foot{padding:14px 32px;color:var(--muted);font-family:var(--head);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:flex;gap:6px 22px;flex-wrap:wrap;background:var(--soft)}
@media (max-width:640px){.foot{padding:14px 20px}}
.banner{padding:12px 32px;background:var(--soft);color:var(--strong);font-size:13.5px;border-bottom:1px solid var(--line)}
.placeholder{background:var(--paper);border:1px solid var(--line);padding:72px 24px;color:var(--muted);text-align:center;font-family:var(--head);font-weight:300;letter-spacing:0;text-transform:none}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

/* editor */
.ed{display:flex;flex-direction:column;gap:0}
.ed .sec{gap:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f.wide{grid-column:1/-1}
.f label{font-family:var(--head);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea,.rows input,.rows select{background:var(--paper);border:1px solid var(--line);border-radius:0;padding:8px 10px;width:100%;min-width:0;color:var(--strong)}
.f input:focus,.f textarea:focus,.rows input:focus{border-color:var(--ink);outline:0}
.f textarea{min-height:80px;resize:vertical;line-height:1.6}
.rows{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.rowed{display:grid;gap:6px;align-items:center;min-width:560px}
.rowed.hd{font-family:var(--head);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}
.undo-link{border:0;background:none;padding:2px 0;font:inherit;font-size:11px;letter-spacing:.08em;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.undo-link:hover{color:var(--ink)}
.undo-ask{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink)}
.btn.ghost{background:none}
.gate .opt{letter-spacing:.04em;text-transform:none;opacity:.8}
.setpw{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.setpw input{padding:8px 10px;border:1px solid var(--line);font:inherit}
/* Edit on page (production) */
.ie{text-transform:none !important;outline:1px dashed transparent;outline-offset:3px;border-radius:2px;cursor:text;transition:outline-color .15s,background .15s;min-width:2ch}
.ie:hover{outline-color:var(--grey1,#BEC1C4)}
.ie:focus{outline:1px solid var(--ink);background:#FFFFFF}
.ie:empty::before{content:attr(data-ph);color:var(--muted);opacity:.55;font-style:italic;text-transform:none}
.ie[data-multi]{white-space:pre-wrap}
span.ie.ie-line,span.ie.d,span.ie.who{display:block}
.fact .ie-line+.ie-line{margin-top:2px}
.sched td.time .ie{display:inline-block}
.ie-state{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.ie-state.ok{color:var(--ink)}
.ie-state.err{color:var(--danger)}
.banner.ie-help{font-size:12.5px;line-height:1.5}
.row-tools{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;font-size:12px;color:var(--ink);text-transform:none;letter-spacing:0}
.row-tools .rt{width:26px;height:26px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px;line-height:1;padding:0;cursor:pointer;border-radius:2px}
.row-tools .rt:hover{border-color:var(--ink)}
.row-tools .rt-kind{height:26px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:12px;padding:0 4px}
.row-tools.ask{gap:8px}
.ie-add{margin-left:auto}
.sec-h .count + .ie-add{margin-left:12px}
.contact .row-tools,.people .row-tools{justify-content:flex-end}
td.tools-td{width:1%;white-space:nowrap}
ul.list li .row-tools{display:inline-flex;margin:0 0 0 10px;vertical-align:middle}
.ie-note{display:inline}

/* ===== onezerofive motion: quiet and slow. Off while editing and for reduced motion. ===== */
:root{--ease-out:cubic-bezier(.25,.6,.3,1)}
/* Opening: title letters settle in softly, then the rest of the header and the facts fade in */
.ozf h2.split .w{display:inline-block;white-space:nowrap}
.ozf h2.split .ch{display:inline-block}
.ozf.intro h2.split .ch{opacity:0;transform:translateY(.15em);animation:oz-rise .6s var(--ease-out) forwards;animation-delay:calc(var(--i) * 22ms + 80ms)}
.ozf.intro .kicker,.ozf.intro .sub,.ozf.intro .crewcall,.ozf.intro .ozf-right .when,.ozf.intro .ozf-right .dayof,.ozf.intro .countdown,.ozf.intro .facts .fact{opacity:0;animation:oz-fade .7s var(--ease-out) forwards}
.ozf.intro .kicker{animation-delay:.05s}
.ozf.intro .countdown{animation-delay:.15s}
.ozf.intro .ozf-right .when,.ozf.intro .ozf-right .dayof{animation-delay:.3s}
.ozf.intro .sub,.ozf.intro .crewcall{animation-delay:.4s}
.ozf.intro .facts .fact{animation-delay:.5s}
@keyframes oz-rise{to{opacity:1;transform:none}}
@keyframes oz-fade{from{opacity:0}to{opacity:1}}
/* Scroll: rows arriving together fade in one after another */
.ozf .rv:not(tr),.ozf tr.rv > td{transition-delay:var(--rd,0ms)}
/* Hover: soft background fade only */
@media (hover:hover){
  .ozf .sheet-top,.ozf .fact,.ozf .dayline,.ozf .contact,.ozf .sched td,.ozf .people td{transition:background-color .4s ease}
}
/* Buttons: a gentle press */
.ozf .btn{transition:border-color .3s ease,background-color .3s ease,transform .12s ease}
.ozf .btn:active{transform:scale(.98)}
/* Confirmed: the mark settles in */
.cf .ok.pop::before{animation:oz-pop .45s var(--ease-out) both}
@keyframes oz-pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
/* Reading progress */
#readbar{position:fixed;top:0;left:0;right:0;height:1px;background:#6B6E73;transform-origin:left center;transform:scaleX(0);opacity:0;transition:opacity .4s;z-index:50;pointer-events:none}
#readbar.on{opacity:.55}
@media (prefers-reduced-motion:reduce){
  .ozf.intro *{animation:none !important;opacity:1}
  .cf .ok.pop::before{animation:none} #readbar{display:none}
}
/* Talent call sits next to crew call */
.ozf .ozf-left .calls{display:flex;gap:44px;flex-wrap:wrap;margin-top:22px}
.ozf .ozf-left .calls .crewcall{margin-top:0}
.ozf.intro .calls .talentcall{animation-delay:.45s}
/* Key contacts directly under the header */
.ozf .contacts-top{border-bottom:1px solid var(--line)}

/* onezerofive sheets: everything lowercase, labels and buttons included (Dean, 13 Oct). Text being edited keeps its real case. */
.ozf *,.ozf *::before,.ozf *::after{text-transform:lowercase !important}
.ozf .ie,.ozf [data-path]:not(#_),.ozf [data-path]:not(#_) *{text-transform:none !important}
/* Links (e.g. the Canva deck): slate wipe on hover, the circumpunct mark draws in and gently pulses. */
.links{border-bottom:1px solid var(--line)}
.link-card{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:18px;padding:18px 36px;color:var(--ink);text-decoration:none;background:#FFFFFF}
.link-card + .link-card{border-top:1px solid var(--line)}
.link-card::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);transform:scaleX(0);transform-origin:left center;transition:transform .55s cubic-bezier(.7,0,.2,1)}
a.link-card:hover::before,a.link-card:focus-visible::before{transform:scaleX(1)}
a.link-card:hover,a.link-card:focus-visible{color:#FFFFFF}
a.link-card:focus-visible{outline:none}
.link-card .lk-mark{width:30px;height:30px;flex:none;overflow:visible}
.lk-mark circle{fill:none;stroke:currentColor;stroke-width:1.3}
.lk-mark .dot{fill:currentColor;stroke:none;transform-origin:12px 12px;animation:lk-dot .5s .9s both cubic-bezier(.2,.8,.2,1.4)}
.lk-mark .ring{stroke-dasharray:70;stroke-dashoffset:70;animation:lk-draw 1s both cubic-bezier(.6,0,.2,1)}
.lk-mark .r1{animation-delay:.15s}
.lk-mark .r2{stroke-dasharray:42;stroke-dashoffset:42;animation-delay:.45s}
.lk-mark .ripple{opacity:0;transform-origin:12px 12px;stroke-width:1;animation:lk-ripple 6s 2s infinite ease-out}
@keyframes lk-draw{to{stroke-dashoffset:0}}
@keyframes lk-dot{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes lk-ripple{0%{opacity:.3;transform:scale(1)}45%,100%{opacity:0;transform:scale(1.6)}}
.lk-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.lk-label{font-family:var(--head);font-size:14px;letter-spacing:.28em;text-transform:lowercase}
.lk-sub{font-family:var(--head);font-size:10px;letter-spacing:.24em;text-transform:lowercase;opacity:.7}
.lk-arrow{margin-left:auto;font-size:18px;transition:transform .45s cubic-bezier(.7,0,.2,1)}
a.link-card:hover .lk-arrow{transform:translateX(8px)}
.ie-link{cursor:default}
.ie-link .row-tools{margin:0 0 0 auto}
.links-add{padding:10px 36px;display:flex}
.links-add .ie-add{margin-left:0}
@media (max-width:700px){ .link-card{padding:16px 20px} .links-add{padding:10px 20px} }
@media (prefers-reduced-motion:reduce){ .lk-mark *{animation:none !important;stroke-dashoffset:0 !important} .lk-mark .ripple{display:none} .link-card::before,.lk-arrow{transition:none} }

.row-tools .rt:disabled{opacity:.3;cursor:default}
.row-tools .rt-drag{display:inline-flex;align-items:center;justify-content:center;cursor:grab;font-size:12px;letter-spacing:-2px;user-select:none}
@media (hover:none){ .row-tools .rt-drag{display:none} }
.dragging{opacity:.4}
.drop-before{box-shadow:inset 0 2px 0 var(--ink)}
.drop-after{box-shadow:inset 0 -2px 0 var(--ink)}
.just-moved,.just-moved td{background:#F4F5F7 !important;transition:background .9s}
.sec-h .ie-add + .ie-add{margin-left:8px}

/* ===== onezerofive brand (from the onezerofive brand guide) =====
   Slate #6B6E73 for headings and key information, Light Grey 01 #BEC1C4 for secondary elements,
   Light Grey 02 #F4F5F7 for background layers, pure white for surfaces.
   Headers Avenir roman lowercase, wide tracking; sub headings Avenir light lowercase; secondary headings Avenir caps.
   Body copy TT Norms. Avenir is used where the device has it (Apple); Nunito Sans / Figtree stand in elsewhere.
   Body text stays slate rather than Light Grey 01 so it's readable on white. */
.b-onezerofive{
  /* Text: Slate Grey #6B6E73 throughout. Background: Light Grey 02 #F4F5F7. Always light, in both themes. */
  color-scheme:light;
  --ink:#6B6E73; --strong:#6B6E73; --muted:#6B6E73; --grey1:#BEC1C4; --line:#D3D6DA; --soft:#FFFFFF; --paper:#F4F5F7; --danger:#9B4A43;
  --head:"Avenir","Avenir Next","Nunito Sans",ui-sans-serif,system-ui,sans-serif;
  --body:"TT Norms","TT Norms Pro","Figtree","Avenir","Nunito Sans",ui-sans-serif,system-ui,sans-serif;
  font-family:var(--body); color:var(--ink);
}
.b-onezerofive.sheet,.grp.b-onezerofive .item{background:#F4F5F7;color:#6B6E73}
.grp.b-onezerofive .item .t small,.grp.b-onezerofive .item .d span{color:#6B6E73}
.b-onezerofive .sheet-top h2{font-weight:400;letter-spacing:.5em;text-transform:lowercase;color:var(--ink);line-height:1.3}
.b-onezerofive .sheet-top .sub{font-weight:300;font-size:14.5px;letter-spacing:.212em;text-transform:lowercase;color:var(--muted)}
.b-onezerofive .sec-h h3{font-weight:400;letter-spacing:.5em;text-transform:lowercase;color:var(--ink)}
.b-onezerofive .kicker,.b-onezerofive .k,.b-onezerofive th,.b-onezerofive .callbox span,.b-onezerofive .chip,.b-onezerofive .foot,.b-onezerofive .f label,.b-onezerofive .rowed.hd{letter-spacing:.37em}
.b-onezerofive .kicker .cs{font-weight:500;text-transform:lowercase;letter-spacing:.3em;color:var(--ink)}
.b-onezerofive .callbox b{font-weight:300;color:var(--ink)}
.b-onezerofive .contact b,.b-onezerofive .item .t strong{font-weight:400;letter-spacing:.12em;text-transform:lowercase;color:var(--strong)}
.b-onezerofive .sched td .who{font-weight:300;letter-spacing:.1em;text-transform:lowercase}
.b-onezerofive .sched td strong{font-weight:500}
.b-onezerofive p,.b-onezerofive td,.b-onezerofive li{line-height:1.8}
.b-onezerofive .cf .ok::before{background:radial-gradient(circle,var(--ink) 0 2px,transparent 2.5px)}
.b-onezerofive .btn.primary{background:var(--ink);border-color:var(--ink)}

.grp.b-onezerofive .item{font-family:var(--body)}

/* ===== onezerofive: flip-clock crew call, scroll blur-fade ===== */
.ozf .callbox{min-width:0;gap:10px}
.ozf .callbox small{display:none}
.flipclock{display:flex;align-items:center;gap:4px;font-family:var(--head);font-variant-numeric:tabular-nums;perspective:240px}
.ozf .callbox .flipclock span,.flipclock span{letter-spacing:0;text-transform:none;font-family:inherit}
.flipclock .flip{position:relative;display:inline-block;width:28px;height:40px;border-radius:3px;color:#FFFFFF;font-size:24px;font-weight:400;perspective:180px;--h:40px}
.flip .f-top,.flip .f-bot,.flip .f-flap-top,.flip .f-flap-bot{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#6B6E73;backface-visibility:hidden}
.flip .f-top,.flip .f-flap-top{top:0;border-radius:3px 3px 0 0;transform-origin:50% 100%}
.flip .f-bot,.flip .f-flap-bot{bottom:0;border-radius:0 0 3px 3px;transform-origin:50% 0}
.flip .f-in{display:block;height:var(--h);line-height:var(--h);text-align:center}
.flip .f-bot .f-in,.flip .f-flap-bot .f-in{transform:translateY(-50%)}
.flip .f-flap-top,.flip .f-flap-bot{visibility:hidden}
.flip.flipping .f-flap-top{visibility:visible;animation:flap-top .32s cubic-bezier(.55,0,.9,.45) var(--d,0ms) both;z-index:2}
.flip.flipping .f-flap-bot{visibility:visible;animation:flap-bot .32s cubic-bezier(.1,.55,.45,1) calc(var(--d,0ms) + .3s) both;z-index:2}
@keyframes flap-top{0%{transform:rotateX(0);filter:brightness(1)}100%{transform:rotateX(-90deg);filter:brightness(.7)}}
@keyframes flap-bot{0%{transform:rotateX(90deg);filter:brightness(1.25)}70%{transform:rotateX(-8deg)}100%{transform:rotateX(0);filter:brightness(1)}}
.flip.flipping .f-bot{animation:shade-bot .62s linear var(--d,0ms) both}
@keyframes shade-bot{0%{filter:brightness(1)}45%{filter:brightness(.8)}100%{filter:brightness(1)}}
.flipclock .flip-colon{font-size:20px;color:#6B6E73;padding:0 2px;line-height:1}
.flip-fallback{font-weight:300;font-size:30px}

/* Scroll reveal: content below the fold fades up with a soft blur the first time it scrolls into view.
   Driven by IntersectionObserver in app.js (setupReveal), so it works in every modern browser.
   Content already on screen is never hidden, and nothing is hidden when reduced motion is set. */
.rv:not(tr),tr.rv > td{opacity:0;transform:translateY(5px)}
.rv:not(tr),tr.rv > td{transition:opacity .6s ease,transform .6s ease}
.rv.rv-in:not(tr),tr.rv.rv-in > td{opacity:1;filter:none;transform:none}

/* ===== Call sheets on phones: stack the tables instead of scrolling sideways ===== */
@media (max-width:640px){
  .sched,.people,.open{min-width:0!important}
  .sched td.time{white-space:normal;width:76px}
  .sched td.time .t1{display:block}
  .people thead,.open thead{display:none}
  .people tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .people tr:last-child{border-bottom:0}
  .people td{border:0;padding:0!important;grid-column:1}
  .people td.time{grid-column:2;grid-row:1;text-align:right}
  .people td:empty{display:none}
  .people td:not(:first-child):not(.time):not(.cfc){font-size:13px;color:var(--muted)}
  .people td.cfc{grid-column:1 / -1;margin-top:6px;width:auto}
  .people .cf{justify-content:flex-start}
  .people .cf small{text-align:left}
  .open tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
  .open td{display:block;border:0;padding:0}
}

/* ===== International Collective hub chrome =====
   Based on the Canva deck "International Collective – CREATIVES":
   cover grey #B2B2B2 with white, widely tracked condensed capitals ("INTERNATIONAL COLLECTIVE", "EST. 2001");
   content pages white, near-black tracked condensed headings, grey body text, thin grey rules.
   Applies to the hub only (background, sidebar, passcode screen). Call sheets keep their own look. */
:root{ --ic-grey:#B2B2B2; --ic-white:#FFFFFF; --ic-ink:#1C1C1C; --ic-body:#6E6E6E; --ic-rule:#C5C5C6;
  --ic-caps:"Oswald","Arial Narrow",ui-sans-serif,sans-serif; }
html,body{background:var(--ic-grey)}
body{color:var(--ic-ink)}
.main{color:var(--ink)}

/* Sidebar: the deck's grey cover */
.side{
  color-scheme:light;
  --ink:#1C1C1C; --strong:#1C1C1C; --muted:#6E6E6E; --grey1:#C5C5C6; --line:#C5C5C6; --paper:#FFFFFF; --soft:#F2F2F2;
  background:transparent; padding:8px 0; color:var(--ic-ink);
}

.brand h1{font-family:var(--ic-caps);font-weight:300;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#fff}
.brand .slogan{display:none}
.brand::after{content:"\25E6\25E6";display:block;width:100%;margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.7);font-size:9px;letter-spacing:.3em;color:#fff;text-align:center;line-height:1}

.side .grp h2,.side .grp h2 .grp-sub{font-family:var(--ic-caps);font-weight:400;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ic-ink)}
.side .item{background:#fff;border-color:#fff;color:var(--ic-ink)}
.side .item:hover{border-color:var(--ic-ink)}
.side .item[aria-current="true"]{border-color:var(--ic-ink);box-shadow:inset 3px 0 0 var(--ic-ink)}
.side .item .d{border-right-color:var(--ic-rule)}
.side .item .d b{font-family:var(--ic-caps);font-weight:300;color:var(--ic-ink)}

/* Passcode screen: the deck's cover */
html:has(#gate:not([hidden])),body:has(#gate:not([hidden])){background:var(--ic-grey);min-height:100%}
.gate{
  color-scheme:light;
  --ink:#FFFFFF; --strong:#FFFFFF; --muted:#FFFFFF; --grey1:rgba(255,255,255,.8); --line:rgba(255,255,255,.6); --paper:transparent; --danger:#7A1F1A;

/* ===================== Dancers Inc. — 2027 style guide =====================
   Calm, airy, weightless. Chalk White ground; pale Pool Blue / Ice Blue bands; no black, no hard shadow.
   Darkest thing is Grey Azure #4A5258; the one bright stroke is Curaçao #7CCFD6.
   Jost only: display Thin/ExtraLight uppercase wide; body Light 300; small caps Regular 400 +0.32em.
   Hairline dividers, square corners. Motion: content rises into place, hovers give a small soft nudge. */
.b-dancers-inc{
  color-scheme:light;
  --ink:#4A5258; --strong:#4A5258; --muted:#7E858A; --grey1:#B8BCC0; --line:#D6D9DC; --soft:#FFFFFF; --paper:#F6F6F4; --danger:#9B4A43;
  --accent:#7CCFD6; --pool:#CDE7EC; --ice:#E6F1F6; --seaglass:#D9EDE7; --adriatic:#A9DCD8;
  --head:"Jost","Helvetica Neue",Arial,sans-serif; --body:"Jost","Helvetica Neue",Arial,sans-serif;
  font-family:var(--body); font-weight:300; color:var(--ink);
}
/* case: real case for body text, uppercase for headlines and small labels (undo the onezerofive lowercase) */
.ozf.dinc *,.ozf.dinc *::before,.ozf.dinc *::after{text-transform:none !important}
.ozf.dinc h2,.ozf.dinc .k,.ozf.dinc .sub,.ozf.dinc .sec-h h3,.ozf.dinc .sec-h .count,.ozf.dinc th,.ozf.dinc .chip,.ozf.dinc .btn,.ozf.dinc .when,.ozf.dinc .dayof,
.ozf.dinc .countdown > .k,.ozf.dinc .flip-label,.ozf.dinc .maplink,.ozf.dinc .contact b,.ozf.dinc .cf .ok,.ozf.dinc .lk-label,.ozf.dinc .lk-sub,.ozf.dinc .foot,.ozf.dinc .sched td .who{text-transform:uppercase !important}
.ozf.dinc h2 *,.ozf.dinc .btn *,.ozf.dinc .sec-h h3 *,.ozf.dinc .foot *{text-transform:uppercase !important}
.ozf.dinc .sched tr.call td,.ozf.dinc .sched tr.meal td{background:transparent}
.ozf.dinc .sched tr.meal td:nth-child(2) strong::after{content:none !important;display:none;text-transform:uppercase !important;font-family:var(--head);font-weight:400;font-size:9px;letter-spacing:.32em;border-color:var(--accent);color:var(--ink)}
.ozf.dinc .ie{text-transform:none !important}
/* ground and surfaces */
.ozf.dinc.sheet,.ozf.dinc .sheet-top,.ozf.dinc .fact,.ozf.dinc .dayline,.ozf.dinc .sec,.ozf.dinc .foot,.ozf.dinc .contact,.ozf.dinc .sched td,.ozf.dinc .people td,.ozf.dinc .link-card,.ozf.dinc .actions{background:#F6F6F4}
.ozf.dinc .sheet-top{background:linear-gradient(180deg,#F6F6F4 0%,#E6F1F6 100%)}
.ozf.dinc .facts{background:linear-gradient(90deg,#CDE7EC 0%,#E6F1F6 100%);border-bottom:0}
.ozf.dinc .facts .fact{background:transparent}
.ozf.dinc .contacts{background:var(--line);border-color:var(--line)}
/* type */
.ozf.dinc,.ozf.dinc p,.ozf.dinc td,.ozf.dinc li{font-family:var(--body);font-weight:300}
.ozf.dinc h2,.ozf.dinc h2.split{font-family:var(--head);font-weight:200;letter-spacing:.12em;line-height:1.12;color:var(--ink)}
.ozf.dinc .sub{font-weight:400;font-size:10px;letter-spacing:.32em;color:var(--muted)}
.ozf.dinc .k,.ozf.dinc th,.ozf.dinc .sec-h .count,.ozf.dinc .flip-label,.ozf.dinc .countdown > .k,.ozf.dinc .maplink,.ozf.dinc .lk-sub,.ozf.dinc .foot{font-family:var(--head);font-weight:400;font-size:10px;letter-spacing:.32em;color:var(--muted)}
.ozf.dinc .sec-h h3{font-family:var(--head);font-weight:200;font-size:22px;letter-spacing:.12em;color:var(--ink)}
.ozf.dinc .sec-h{flex-direction:column;align-items:flex-start;gap:14px}
.ozf.dinc .sec-h h3::after{content:"";display:block;width:34px;height:1px;background:var(--ink);margin-top:14px}
.ozf.dinc .ozf-left .crewcall b{font-weight:200;font-size:34px;letter-spacing:.06em;color:var(--ink)}
.ozf.dinc .when,.ozf.dinc .dayof{font-weight:400;font-size:11px;letter-spacing:.32em;color:var(--ink)}
.ozf.dinc .fact .v,.ozf.dinc .fact-list li{font-weight:300;color:var(--ink)}
.ozf.dinc .contact b{font-weight:400;font-size:12px;letter-spacing:.24em;color:var(--ink)}
.ozf.dinc .contact .r{font-weight:300;color:var(--muted)}
.ozf.dinc .sched td strong{font-weight:400;color:var(--ink)}
.ozf.dinc .sched td .who{font-weight:400;font-size:10px;letter-spacing:.24em;color:var(--muted)}
.ozf.dinc .sched td.time,.ozf.dinc .people td.time{font-weight:300;letter-spacing:.08em;color:var(--ink)}
/* the logo pill (Charge gradient, Sky → Curaçao) */
.dinc-pill{display:inline-flex;align-items:center;gap:.28em;padding:7px 16px;border-radius:999px;background:linear-gradient(135deg,#9FDCE3 0%,#7CCFD6 100%);color:#FFFFFF;font-family:"Jost","Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:12px;letter-spacing:.06em;line-height:1}
.dinc-pill b{font-weight:500}
.ozf.dinc .chip{border-radius:0;border-color:var(--line);color:var(--muted);font-weight:400;font-size:9px;letter-spacing:.32em}
/* countdown: pale Pool Blue tiles, thin Grey Azure digits, square corners */
.ozf.dinc .flip .f-top,.ozf.dinc .flip .f-bot,.ozf.dinc .flip .f-flap-top,.ozf.dinc .flip .f-flap-bot{background:#CDE7EC;border-radius:0}
.ozf.dinc .flipclock .flip{color:#4A5258;font-weight:200;border-radius:0}
.ozf.dinc .flipclock .flip-colon{color:#7CCFD6;font-weight:200}
/* lists: the brand bullet — a short Curaçao hairline */
.ozf.dinc ul.list li::before{width:12px;height:1px;top:.85em;border:0;border-radius:0;background:var(--accent)}
.ozf.dinc .fact-link .v,.ozf.dinc .fact-link .fact-list li,.ozf.dinc .contact a.n{text-decoration-color:var(--accent)}
/* buttons: outline; hover border to Grey Azure, ground white 50% */
.ozf.dinc .btn{border-radius:0;border:1px solid var(--grey1);background:transparent;color:var(--ink);font-family:var(--head);font-weight:400;font-size:10px;letter-spacing:.28em}
@media (hover:hover){ .ozf.dinc .btn:not(:disabled):hover{border-color:var(--ink);background:rgba(255,255,255,.5)} }
.ozf.dinc .btn.primary{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
@media (hover:hover){ .ozf.dinc .btn.primary:not(:disabled):hover{background:#5A6369;border-color:#5A6369} }
.ozf.dinc .cf .ok::before{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 2px,transparent 2.5px)}
/* campaign/deck links in Dancers Inc. colours */
.ozf.dinc .link-card::before{background:linear-gradient(90deg,#CDE7EC,#E6F1F6)}
.ozf.dinc a.link-card:hover,.ozf.dinc a.link-card:focus-visible{color:var(--ink)}
.ozf.dinc .lk-mark circle{stroke:var(--accent)} .ozf.dinc .lk-mark .dot{fill:var(--accent)}
/* hover: Ice Blue wash and a small, soft nudge */
@media (hover:hover){
  .ozf.dinc .fact:hover,.ozf.dinc .contact:hover,.ozf.dinc .dayline:hover,.ozf.dinc .sheet-top:hover{background-color:transparent}
  .ozf.dinc .contact:hover{background:#E6F1F6}
  .ozf.dinc:not(.editing) .sched tr:hover td,.ozf.dinc:not(.editing) .people tr:hover td{background:#E6F1F6}
  .ozf.dinc:not(.editing) .sched td strong,.ozf.dinc:not(.editing) .people td:first-child{transition:transform .45s cubic-bezier(.34,1.56,.64,1),background-color .4s ease}
  .ozf.dinc:not(.editing) .sched td strong{display:inline-block}
  .ozf.dinc:not(.editing) .sched tr:hover td strong{transform:translateX(3px)}
}
/* motion: content rises into place (the onezerofive sheet only fades) */
.ozf.dinc.intro .kicker,.ozf.dinc.intro .sub,.ozf.dinc.intro .crewcall,.ozf.dinc.intro .ozf-right .when,.ozf.dinc.intro .ozf-right .dayof,.ozf.dinc.intro .countdown,.ozf.dinc.intro .facts .fact{animation-name:di-rise}
@keyframes di-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ozf.dinc .rv:not(tr),.ozf.dinc tr.rv > td{transform:translateY(10px)}
.ozf.dinc .rv.rv-in:not(tr),.ozf.dinc tr.rv.rv-in > td{transform:none}
.ozf.dinc ~ #readbar, body:has(.ozf.dinc) #readbar{background:#7CCFD6}
@media (prefers-reduced-motion:reduce){ .ozf.dinc:not(.editing) .sched tr:hover td strong{transform:none} }

.lk-mark.lk-dinc .arrow{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-linecap:square;stroke-dasharray:20;stroke-dashoffset:20;animation:lk-draw .8s .8s both cubic-bezier(.6,0,.2,1);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
a.link-card:hover .lk-mark.lk-dinc .arrow{transform:translateX(1.5px)}
.ozf.dinc .lk-label{font-weight:400;font-size:12px;letter-spacing:.32em;color:var(--ink)}
.ozf.dinc .lk-arrow{color:var(--ink)}
@media (prefers-reduced-motion:reduce){ .lk-mark.lk-dinc .arrow{animation:none;stroke-dashoffset:0} }

/* Dancers Inc.: numbered talent list — the brand's thin index numeral (01, 02 …) */
.ozf.dinc .people-cast tbody{counter-reset:talent}
.ozf.dinc .people-cast tbody tr{counter-increment:talent}
.ozf.dinc .people-cast tbody td:first-child::before{content:counter(talent, decimal-leading-zero);display:inline-block;min-width:2.4em;margin-right:6px;font-family:var(--head);font-weight:200;font-size:15px;letter-spacing:.06em;color:var(--ink);font-variant-numeric:tabular-nums}

/* Description text uses normal letter-spacing on all designed sheets (Dean, 14 Oct); titles, labels and headings keep their tracking */
.ozf .sched td .who,.ozf .sched td .d,.ozf .sched .desc-list li,.ozf .fact .v,.ozf .fact-list li,.ozf .contact .r,.ozf .dayline p,.ozf .lk-sub{letter-spacing:normal !important}

/* Cast & crew tables (computers): fixed, evenly spaced columns; call and base centred (Dean, 14 Oct) */
@media (min-width:641px){
  .ozf:not(.editing) .people{table-layout:fixed;width:100%}
  .ozf:not(.editing) .people th.c-name{width:30%}
  .ozf:not(.editing) .people th.c-role{width:auto}
  .ozf:not(.editing) .people th.c-call{width:13%}
  .ozf:not(.editing) .people th.c-base{width:15%}
  .ozf:not(.editing) .people th.c-cf{width:16%}
  .ozf:not(.editing) .people :is(th,td):is(.c-call,.c-base){text-align:center}
  .ozf:not(.editing) .people td.time{white-space:nowrap}
  .ozf:not(.editing) .people td{overflow-wrap:anywhere}
}

/* ===================== I.N.C The Circle — 2027 style guide =====================
   "Deeper ink, quieter light, the same generous white space." Shares Jost and structure with Dancers Inc. (class "dinc");
   the difference lives in the ink. Light Azure ground (70%), Circle Ink / Midnight for headlines, rules and solids; Slate body;
   Steel only for eyebrows and metadata; Ice Blue as the single tint band. No pure black, no pure white, no saturated accent. */
.b-the-circle{
  color-scheme:light;
  --ink:#1C3E55; --strong:#12222D; --muted:#7E909D; --grey1:#B9C4CB; --line:#DDE3E7; --soft:#F3F4F5; --paper:#F3F4F5; --danger:#8A3B3B;
  --accent:#1C3E55; --pool:#E6F1F6; --ice:#E6F1F6; --slate:#3A4E5C;
  --head:"Jost","Helvetica Neue",Arial,sans-serif; --body:"Jost","Helvetica Neue",Arial,sans-serif;
  font-family:var(--body); font-weight:300; color:var(--ink);
}
.ozf.circ.sheet,.ozf.circ .sheet-top,.ozf.circ .fact,.ozf.circ .dayline,.ozf.circ .sec,.ozf.circ .foot,.ozf.circ .contact,.ozf.circ .sched td,.ozf.circ .people td,.ozf.circ .link-card,.ozf.circ .actions{background:#F3F4F5}
.ozf.circ .sheet-top{background:#F3F4F5}
.ozf.circ .facts{background:#E6F1F6}
.ozf.circ .facts .fact{background:transparent}
.ozf.circ h2,.ozf.circ h2.split{font-weight:100;letter-spacing:.14em;color:var(--ink)}
.ozf.circ .sec-h h3{font-weight:200;color:var(--ink)}
.ozf.circ .sec-h h3::after{background:var(--ink)}
.ozf.circ .fact .v,.ozf.circ .fact-list li,.ozf.circ .sched td .d,.ozf.circ .contact .r{color:var(--slate)}
.ozf.circ .ozf-left .crewcall b{font-weight:100;color:var(--ink)}
/* the lock-up: mark left, I.N.C over THE CIRCLE */
.circle-lockup{display:inline-flex;align-items:center;gap:10px;color:var(--ink)}
.circle-lockup .circle-mark{width:34px;height:34px;flex:none}
.circle-mark .ring,.lk-circ .ring{fill:none;stroke:currentColor;stroke-width:.9}
.circle-mark .disc,.lk-circ .disc{fill:currentColor;stroke:none}
.circle-mark .void,.lk-circ .void{fill:#F3F4F5;stroke:none}
.cl-words{display:flex;flex-direction:column;line-height:1.1}
.cl-inc{font-family:var(--head);font-weight:200;font-size:15px;letter-spacing:.32em}
.cl-name{font-family:var(--head);font-weight:400;font-size:8.5px;letter-spacing:.38em}
/* countdown: Circle Ink tiles with Light Azure digits */
.ozf.circ .flip .f-top,.ozf.circ .flip .f-bot,.ozf.circ .flip .f-flap-top,.ozf.circ .flip .f-flap-bot{background:#1C3E55}
.ozf.circ .flipclock .flip{color:#F3F4F5;font-weight:200}
.ozf.circ .flipclock .flip-colon{color:#7E909D}
/* bullets: the 4px ink "active dot" */
.ozf.circ ul.list li::before{width:4px;height:4px;border-radius:50%;top:.75em;background:var(--ink)}
.ozf.circ .fact-link .v,.ozf.circ .fact-link .fact-list li,.ozf.circ .contact a.n{text-decoration-color:var(--grey1)}
.ozf.circ .fact-link:hover .v,.ozf.circ .fact-link:hover .fact-list li,.ozf.circ .contact a.n:hover{text-decoration-color:var(--ink)}
/* buttons: outline with a Silvermist rule; the one solid is Circle Ink */
.ozf.circ .btn{border-color:var(--grey1);color:var(--ink)}
@media (hover:hover){ .ozf.circ .btn:not(:disabled):hover{border-color:var(--ink);background:#E6F1F6} }
.ozf.circ .btn.primary{background:#1C3E55;border-color:#1C3E55;color:#F3F4F5}
@media (hover:hover){ .ozf.circ .btn.primary:not(:disabled):hover{background:#12222D;border-color:#12222D} }
.ozf.circ .cf .ok::before{border-color:var(--ink);background:radial-gradient(circle,var(--ink) 0 2px,transparent 2.5px)}
/* hover: a quiet Ice Blue wash, no colour shift in the type */
@media (hover:hover){
  .ozf.circ .contact:hover{background:#E6F1F6}
  .ozf.circ:not(.editing) .sched tr:hover td,.ozf.circ:not(.editing) .people tr:hover td{background:#E6F1F6}
}
/* links: Ice Blue wash on hover; the Circle mark as the icon */
.ozf.circ .link-card::before{background:#E6F1F6}
.ozf.circ .lk-mark.lk-circ{color:var(--ink)}
.ozf.circ .lk-mark.lk-circ .ring{stroke-dasharray:72;stroke-dashoffset:72;animation:lk-draw 1s .15s both cubic-bezier(.6,0,.2,1)}
.ozf.circ .lk-mark.lk-circ .disc{transform-origin:12px 12px;animation:lk-dot .6s .8s both cubic-bezier(.2,.8,.2,1.2)}
/* index numerals: Thin 100, always two digits */
.ozf.circ .people-cast tbody td:first-child::before{font-weight:100;font-size:17px;color:var(--ink)}
body:has(.ozf.circ) #readbar{background:#1C3E55}
@media (prefers-reduced-motion:reduce){ .ozf.circ .lk-mark.lk-circ *{animation:none !important;stroke-dashoffset:0 !important} }

#list .grp h2{margin:0 0 4px;padding-left:2px;line-height:1.4}
#list .grp + .grp{padding-top:4px}
.side .item{grid-template-columns:48px 1fr;gap:16px;padding:16px 16px 16px 14px;align-items:center}
.side .item .d{padding-right:14px;align-self:stretch}
.side .item .t{gap:4px}
.side .item .t strong{line-height:1.35}
.side .item .meta{gap:6px;margin-top:8px}
.side .item .meta .chip{letter-spacing:.08em;padding:2px 6px;line-height:1.5;white-space:nowrap}
.side .item .meta{gap:5px}
.side .item{grid-template-columns:40px 1fr;gap:12px;padding:16px 12px 16px 10px}.side .item .d{padding-right:10px}

/* ===== Liquid Glass — test on Dancers Inc. (.sheet.glass) ===== */
.glass{--g-hover:rgba(230,244,248,.85);--g-btn:rgba(214,239,244,.65);--g-hl:rgba(143,211,222,.28);--g-okc:#7CCFD6;--g-tint:rgba(232,246,249,.55);--g-edge:rgba(255,255,255,.75);--g-ink:#2E4A55;--g-shadow:rgba(28,74,92,.16);--g-spring:cubic-bezier(.22,1.35,.36,1)}
.glass .g-glass{
  background:
    radial-gradient(140% 120% at var(--g-sheen,30%) -30%, rgba(255,255,255,.75), rgba(255,255,255,0) 52%),
    linear-gradient(180deg, rgba(255,255,255,.5), var(--g-tint));
  -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.05);
  backdrop-filter:blur(26px) saturate(190%) brightness(1.05);
  border:1px solid var(--g-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.35), inset 0 0 0 .5px rgba(255,255,255,.4),
             0 10px 30px var(--g-shadow), 0 1px 3px rgba(28,74,92,.10);
  color:var(--g-ink);
}
/* Sticky bar that floats in once the header has scrolled away */
.glass .g-wrap{position:sticky;top:0;height:0;z-index:40}
.glass .g-bar{position:absolute;left:14px;right:14px;top:12px;display:flex;align-items:center;gap:22px;padding:10px 12px 10px 12px;border-radius:20px;
  font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;font-size:11px;
  opacity:0;transform:translateY(-130%) scale(.94);pointer-events:none;transition:transform .6s var(--g-spring), opacity .25s ease}
.glass.g-on .g-bar{opacity:1;transform:none;pointer-events:auto}
.glass .g-pill{font-size:10px;padding:5px 12px;flex:none}
.glass .g-cd{font-weight:300;font-size:15px;letter-spacing:.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.glass .g-calls{display:flex;gap:18px;margin-left:auto}
.glass .g-calls span,.glass .g-me{display:inline-flex;align-items:baseline;gap:7px;white-space:nowrap;font-size:15px;font-weight:300;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.glass .g-bar i,.glass .g-fab .g-fab-k{font-style:normal;font-size:9.5px;font-weight:400;letter-spacing:.24em;opacity:.75}
.glass .g-me{border:0;cursor:pointer;color:inherit;font-family:inherit;text-transform:inherit;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 #fff, 0 1px 2px rgba(28,74,92,.12);transition:transform .35s var(--g-spring)}
.glass .g-me:active{transform:scale(.93)}
.glass .g-ok{font-size:12px;color:var(--g-okc);font-weight:500}
/* Floating "your call" capsule (phones) */
.glass .g-fab{display:none}
@media (max-width:640px){
  .glass .g-bar{left:10px;right:10px;top:10px;gap:12px;padding:8px 10px}
  .glass .g-calls,.glass .g-me{display:none}
  .glass .g-cd{margin-left:auto;font-size:14px}
  .glass .g-fab{display:inline-flex;align-items:baseline;gap:9px;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;
    padding:13px 20px;border-radius:999px;font-family:var(--head);text-transform:uppercase;letter-spacing:.1em;font-size:15px;font-weight:300;cursor:pointer;
    opacity:0;transform:translateY(40px) scale(.9);pointer-events:none;transition:transform .6s var(--g-spring), opacity .25s ease}
  .glass.g-on .g-fab{opacity:1;transform:none;pointer-events:auto}
  .glass .g-fab:active{transform:scale(.92)}
  .glass .g-fab b{font-weight:300;font-variant-numeric:tabular-nums}
}
/* Row you jumped to glows briefly */
.glass tr.g-hl td{animation:g-hl 1.8s ease}
@keyframes g-hl{0%,35%{background:var(--g-hl)}100%{background:transparent}}
/* Confirm buttons: glass capsules that squash and spring back */
.glass .cf .btn{border-radius:999px;border:1px solid var(--g-edge);color:var(--g-ink);
  background:radial-gradient(140% 120% at 30% -40%, rgba(255,255,255,.95), rgba(255,255,255,0) 55%), linear-gradient(180deg, rgba(255,255,255,.7), var(--g-btn));
  box-shadow:inset 0 1px 0 #fff, inset 0 -1px 1px rgba(255,255,255,.4), 0 4px 12px rgba(28,74,92,.10), 0 1px 2px rgba(28,74,92,.10);
  transition:transform .4s var(--g-spring), box-shadow .2s ease}
.glass .cf .btn:hover{box-shadow:inset 0 1px 0 #fff, 0 6px 16px rgba(28,74,92,.16), 0 1px 2px rgba(28,74,92,.12)}
.glass .cf .btn:active{transform:scale(.9,.86)}
.glass .cf .ok.pop{animation:g-pop .7s var(--g-spring)}
@keyframes g-pop{0%{transform:scale(.6,.9);opacity:.2}60%{transform:scale(1.08,.96)}100%{transform:none;opacity:1}}
/* Footer links: a glass sheen on hover */
.glass .links-foot .link-card{transition:background .3s ease, transform .4s var(--g-spring)}
.glass .links-foot .link-card:hover{background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(226,244,248,.75))}
.glass .links-foot .link-card:active{transform:scale(.985)}
/* Fallbacks: no backdrop blur, Reduce Transparency, Reduce Motion */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass .g-glass{background:rgba(246,251,252,.97)} }
@media (prefers-reduced-transparency: reduce){ .glass .g-glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:#F6FAFB} }
@media (prefers-reduced-motion: reduce){ .glass .g-bar,.glass .g-fab,.glass .cf .btn,.glass .g-me{transition:opacity .2s ease !important} .glass .g-bar,.glass .g-fab{transform:none !important} .glass tr.g-hl td,.glass .cf .ok.pop{animation:none} }

/* Glass hover focus: the row you point at grows 5% and tints; the rest of that table softly blurs (mouse / trackpad only) */
@media (hover:hover) and (pointer:fine){
  .glass .tbl{padding-block:18px;margin-block:-18px}
  .glass .sched tbody tr,.glass .people tbody tr{transition:transform .45s var(--g-spring), filter .3s ease, opacity .3s ease;transform-origin:center}
  .glass .sched tbody:has(tr:hover) tr:not(:hover),
  .glass .people tbody:has(tr:hover) tr:not(:hover){filter:blur(.4px);opacity:.8}
  .glass .sched tbody tr:hover,.glass .people tbody tr:hover{transform:scale(1.01);position:relative;z-index:2}
  .glass .sched tbody tr:hover td,.glass .people tbody tr:hover td{background:var(--g-hover) !important;border-color:transparent}
  .glass .sched tbody tr:hover,.glass .people tbody tr:hover{outline:10px solid var(--g-hover);outline-offset:-1px;border-radius:12px}
  .glass .sched tr:hover td strong{transform:none}
}
@media (prefers-reduced-motion: reduce){ .glass .sched tbody tr:hover,.glass .people tbody tr:hover{transform:none} }

/* Glass per brand */
.glass.b-onezerofive{--g-tint:rgba(244,245,247,.6);--g-hover:rgba(239,240,242,.92);--g-btn:rgba(236,237,240,.75);--g-hl:rgba(107,110,115,.12);--g-okc:#6B6E73;--g-ink:#5E6166;--g-shadow:rgba(60,62,66,.14)}
.glass.b-onezerofive .g-bar{text-transform:lowercase;letter-spacing:.3em}
.glass.b-onezerofive .g-bar i,.glass.b-onezerofive .g-fab .g-fab-k{letter-spacing:.3em}
.glass.b-onezerofive .g-fab{text-transform:lowercase;letter-spacing:.2em}
.glass.b-onezerofive .cf .btn{text-transform:lowercase;letter-spacing:.3em}
.glass .g-mark{flex:none;font-family:var(--head);font-size:11px;letter-spacing:.32em;padding:5px 4px 5px 8px}
.glass.circ{--g-tint:rgba(230,241,246,.58);--g-hover:rgba(230,241,246,.92);--g-btn:rgba(218,233,240,.75);--g-hl:rgba(28,62,85,.10);--g-okc:#1C3E55;--g-ink:#1C3E55;--g-shadow:rgba(18,34,45,.14);--g-edge:rgba(255,255,255,.8)}
.glass .g-circ{display:inline-flex;align-items:center;gap:9px;font-weight:400;letter-spacing:.3em;font-size:10.5px;color:#1C3E55}
.glass .g-circ svg{width:22px;height:22px}
.glass .g-cmark .ring{fill:none;stroke:currentColor;stroke-width:.9}.glass .g-cmark .disc{fill:currentColor}.glass .g-cmark .void{fill:#F3F4F5}

/* Glass section titles (test: Dancers Inc.) — minimal at rest; turns into glass as it nears the reading line (--gt 0→1, set on scroll) */
.glass .sec-h:not(.sec-plain){--gt:0;position:relative;isolation:isolate;overflow:hidden;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:16px;
  padding:16px 26px;border-radius:999px;margin-inline:-6px;
  box-shadow:0 10px 28px rgba(var(--gt-sh),calc(.10 * var(--gt))), 0 1px 3px rgba(var(--gt-sh),calc(.08 * var(--gt))), inset 0 0 0 1px rgba(var(--gt-sh),calc(.12 * (1 - var(--gt))))}
.glass .sec-h:not(.sec-plain)::before{content:"";position:absolute;inset:-40% -45%;z-index:-2;
  background:
    radial-gradient(30% 95% at 12% 55%, var(--gt-a) 0%, transparent 72%),
    radial-gradient(32% 100% at 88% 60%, var(--gt-b) 0%, transparent 72%),
    var(--gt-base);
  filter:blur(18px);opacity:calc(var(--gt) * .9);animation:g-flow 9s ease-in-out infinite alternate}
.glass .sec-h:not(.sec-plain)::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;opacity:var(--gt);
  background:linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.25) 55%, rgba(255,255,255,.38) 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.5), inset 0 0 0 1.5px rgba(255,255,255,.65), inset 0 0 18px rgba(255,255,255,.35)}
.glass.dinc .sec-h:not(.sec-plain) h3{font-size:18px;letter-spacing:.14em;white-space:nowrap}
.glass .sec-h:not(.sec-plain) h3::after{display:none}
.glass .sec-h:not(.sec-plain) h3{white-space:nowrap}
.glass .sec-h:not(.sec-plain) .count{margin-left:auto;white-space:nowrap}
@media (max-width:640px){
  .glass .sec-h:not(.sec-plain){padding:13px 18px;margin-inline:-4px;gap:10px}
  .glass.dinc .sec-h:not(.sec-plain) h3{font-size:15px;letter-spacing:.1em}
  .glass.dinc .sec-h:not(.sec-plain) .count{letter-spacing:.18em}
  .glass .sec-h:not(.sec-plain) .count .bar{display:none}
}
@media (prefers-reduced-transparency: reduce){ .glass .sec-h:not(.sec-plain)::before{filter:none;background:var(--gt-base)} }

/* Title glass: the blue flows across; hover lifts it 2% and brings it fully to glass */
@property --gt{syntax:"<number>";inherits:true;initial-value:0}
.glass .sec-h:not(.sec-plain){transition:--gt .35s ease, transform .45s var(--g-spring)}
@keyframes g-flow{0%{transform:translateX(-28%)}100%{transform:translateX(28%)}}
@media (hover:hover) and (pointer:fine){
  .sheet.glass .sec-h:not(.sec-plain):hover{--gt:1 !important;transform:scale(1.01)}
}
@media (prefers-reduced-motion: reduce){ .glass .sec-h:not(.sec-plain)::before{animation:none} .sheet.glass .sec-h:not(.sec-plain):hover{transform:none} }

/* Glass title colours per brand */
.glass{--gt-a:rgba(124,207,214,.55);--gt-b:rgba(159,220,227,.45);--gt-base:#EEF7F8;--gt-sh:28,74,92}
.glass.b-onezerofive{--gt-a:rgba(150,153,158,.32);--gt-b:rgba(190,192,196,.38);--gt-base:#F5F6F7;--gt-sh:60,62,66}
.glass.circ{--gt-a:rgba(28,62,85,.16);--gt-b:rgba(185,196,203,.45);--gt-base:#EDF4F7;--gt-sh:18,34,45}
.glass.b-onezerofive .sec-h:not(.sec-plain) h3{font-size:13px}
@media (max-width:640px){ .glass.b-onezerofive .sec-h:not(.sec-plain) h3{letter-spacing:.3em} .glass.b-onezerofive .sec-h:not(.sec-plain) .count{letter-spacing:.16em} }
</style>
